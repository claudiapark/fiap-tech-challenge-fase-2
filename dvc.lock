      data/processed/train.csv --test data/processed/test.csv --model-output 
      models/purchase_propensity.joblib --metrics-output reports/metrics.json 
      --random-state 42 --cv-folds 5 --primary-metric cv_pr_auc_mean 
      --tracking-uri sqlite:///mlflow.db --experiment-name purchase-propensity 
      --registered-model-name purchase-propensity-classifier --model-alias 
      champion
    deps:

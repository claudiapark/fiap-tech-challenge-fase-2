schema: '2.0'
stages:
  download:
    cmd: uv run python -m purchase_propensity.data.download --url 
      https://archive.ics.uci.edu/static/public/468/online+shoppers+purchasing+intention+dataset.zip
      --sha256 b3055ee355f59134d851d32641183cb4a8b45def7124d2f50442a042f358e0d9 
      --output data/raw/online_shoppers_intention.csv
    deps:
    - path: src/purchase_propensity/data/download.py
      hash: md5
      md5: 3f8ebce977640eb5854f0b7a72bc21ca
      size: 2193
    params:
      params.yaml:
        data.sha256: 
          b3055ee355f59134d851d32641183cb4a8b45def7124d2f50442a042f358e0d9
        data.url: 
          https://archive.ics.uci.edu/static/public/468/online+shoppers+purchasing+intention+dataset.zip
    outs:
    - path: data/raw/online_shoppers_intention.csv
      hash: md5
      md5: cc6ec1db03b4f10f8de52c56ff48b085
      size: 1072063
  prepare:
    cmd: uv run python -m purchase_propensity.data.prepare --input 
      data/raw/online_shoppers_intention.csv --train-output 
      data/processed/train.csv --test-output data/processed/test.csv --test-size
      0.2 --random-state 42
    deps:
    - path: data/raw/online_shoppers_intention.csv
      hash: md5
      md5: cc6ec1db03b4f10f8de52c56ff48b085
      size: 1072063
    - path: src/purchase_propensity/data/prepare.py
      hash: md5
      md5: 230559a520d7a39eb6aad44707a4e12d
      size: 3094
    - path: src/purchase_propensity/schema.py
      hash: md5
      md5: 7088035cdb33e53fdef7ca023adae064
      size: 602
    params:
      params.yaml:
        split.random_state: 42
        split.test_size: 0.2
    outs:
    - path: data/processed/test.csv
      hash: md5
      md5: e9e3fa9b064fc60fec399159b9a46dee
      size: 222166
    - path: data/processed/train.csv
      hash: md5
      md5: 5baec3151425b828e795e1669c922e0c
      size: 887608
  train:

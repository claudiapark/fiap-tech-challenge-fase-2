[project]
name = "purchase-propensity"
version = "0.1.0"
description = "Reproducible MLOps pipeline for e-commerce purchase propensity classification"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dvc>=3.60,<4",
    "joblib>=1.4,<2",
    "mlflow>=3.5,<4",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
train-purchase-model = "purchase_propensity.training.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purchase_propensity"]

[tool.pytest.ini_options]
addopts = "-q --cov=purchase_propensity --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

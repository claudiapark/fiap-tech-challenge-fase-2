name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-pipeline:
    name: Code Quality, Tests and Model Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: uv run python -m compileall -q src tests

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests and coverage
        run: uv run pytest

      - name: Train model and enforce quality gate
        run: uv run dvc repro

      - name: Validate generated model metrics
        run: >-
          uv run python -m purchase_propensity.modeling.quality_gate
          --report reports/metrics.json
          --minimum-score 0.50

      - name: Display model metrics
        run: uv run dvc metrics show

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-and-pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: purchase-propensity:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests and coverage
        run: uv run pytest

      - name: Reproduce DVC pipeline
        run: uv run dvc repro

      - name: Show metrics
        run: uv run dvc metrics show

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: purchase-propensity:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: >-
          docker run --detach
          --name purchase-propensity-ci
          --publish 5000:5000
          purchase-propensity:ci

      - name: Wait for healthy container
        shell: bash
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' purchase-propensity-ci)"
            echo "Health status: ${status} (attempt ${attempt}/60)"
            if [ "${status}" = "healthy" ]; then
              curl --fail --silent --show-error http://127.0.0.1:5000/health
              exit 0
            fi
            if [ "${status}" = "unhealthy" ]; then
              docker logs purchase-propensity-ci
              exit 1
            fi
            sleep 5
          done
          docker logs purchase-propensity-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs purchase-propensity-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force purchase-propensity-ci || true


name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-pipeline:
    name: Quality, API tests and DVC pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: uv run python -m compileall -q src tests

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run unit, API contract and coverage tests
        run: uv run pytest

      - name: Reproduce DVC pipeline and register model
        run: uv run dvc repro

      - name: Show tracked model metrics
        run: uv run dvc metrics show

  docker-build:
    name: MLflow image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-and-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: purchase-propensity:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
